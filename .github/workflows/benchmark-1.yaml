name: benchmark-1

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [
          ubicloud-standard-4-ubuntu-2204,
          ubicloud-premium-4-ubuntu-2204,
          ubicloud-standard-4-ubuntu-2404,
          ubicloud-premium-4-ubuntu-2404,
        ]
    name: ${{matrix.runs-on}}
    runs-on: ${{matrix.runs-on}}
    continue-on-error: true

    steps:
    - name: Install benchmark tools
      run: |
        sudo apt-get update
        sudo apt-get install -y sysbench fio p7zip-full postgresql-client
        mkdir -p /tmp/fio
    - name: "I/O: fio random read 4K (iodepth=256)"
      run: |
        OUTPUT=$(fio --name=rand-read-4k-deep --ioengine=libaio --direct=1 --bs=4k --iodepth=256 \
          --size=1G --numjobs=4 --rw=randread --group_reporting --runtime=30 --time_based \
          --directory=/tmp/fio)
        echo "$OUTPUT"
        BW=$(echo "$OUTPUT" | grep "READ:" | grep -oP 'bw=\S+' | head -1)
        echo "I/O: fio rand read 4K (d256)=$BW" >> "$S"
        rm -rf /tmp/fio && mkdir -p /tmp/fio
    - name: "I/O: fio random write 4K (iodepth=256)"
      run: |
        OUTPUT=$(fio --name=rand-write-4k-deep --ioengine=libaio --direct=1 --bs=4k --iodepth=256 \
          --size=1G --numjobs=4 --rw=randwrite --group_reporting --runtime=30 --time_based \
          --directory=/tmp/fio)
        echo "$OUTPUT"
        BW=$(echo "$OUTPUT" | grep "WRITE:" | grep -oP 'bw=\S+' | head -1)
        echo "I/O: fio rand write 4K (d256)=$BW" >> "$S"
        rm -rf /tmp/fio && mkdir -p /tmp/fio
    - name: "I/O: fio mixed random read/write 4K (iodepth=256)"
      run: |
        OUTPUT=$(fio --name=rand-rw-4k-deep --ioengine=libaio --direct=1 --bs=4k --iodepth=256 \
          --size=1G --numjobs=4 --rw=randrw --rwmixread=70 --group_reporting --runtime=30 --time_based \
          --directory=/tmp/fio)
        echo "$OUTPUT"
        READ_BW=$(echo "$OUTPUT" | grep "READ:" | grep -oP 'bw=\S+' | head -1)
        WRITE_BW=$(echo "$OUTPUT" | grep "WRITE:" | grep -oP 'bw=\S+' | head -1)
        echo "I/O: fio mixed r/w 4K read (d256)=$READ_BW" >> "$S"
        echo "I/O: fio mixed r/w 4K write (d256)=$WRITE_BW" >> "$S"
        rm -rf /tmp/fio
