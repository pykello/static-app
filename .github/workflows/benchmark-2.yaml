name: benchmark-2

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [
          ubicloud-standard-4-ubuntu-2204,
          ubicloud-premium-4-ubuntu-2204,
          ubicloud-standard-4-ubuntu-2404,
          ubicloud-premium-4-ubuntu-2404,
        ]
    name: ${{matrix.runs-on}}
    runs-on: ${{matrix.runs-on}}
    continue-on-error: true

    steps:
    - name: Install benchmark tools
      run: |
        sudo apt-get update
        sudo apt-get install -y sysbench fio p7zip-full postgresql-client
        mkdir -p /tmp/fio
    - name: tune
      run: echo 50000000 | sudo tee /sys/kernel/debug/sched/migration_cost_ns
    - name: "I/O: fio random read/write 4K (iodepth=256)"
      run: |
        fio --name=rand-read-4k-deep --ioengine=libaio --direct=1 --bs=4k --iodepth=256 \
          --size=1G --numjobs=4 --rw=randread --group_reporting --runtime=30 --time_based \
          --directory=/tmp/fio
        fio --name=rand-write-4k-deep --ioengine=libaio --direct=1 --bs=4k --iodepth=256 \
          --size=1G --numjobs=4 --rw=randwrite --group_reporting --runtime=30 --time_based \
          --directory=/tmp/fio
